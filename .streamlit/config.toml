[theme]
primaryColor = "#002F86"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F5FB"
textColor = "#0B1F4B"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
# Visitors get the read-only menu: no Rerun / Clear cache / Deploy items that only developers need.
toolbarMode = "viewer"

[server]
# NOTE: no `address` here on purpose. Hosted platforms choose the bind address themselves;
# Start.ps1 passes --server.address 127.0.0.1 (or 0.0.0.0 with -Share) for local runs.
headless = true
maxUploadSize = 50
enableStaticServing = true
